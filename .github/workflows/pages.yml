name: Deploy to GitHub Pages

# Builds the static site and publishes apps/web/out to https://<user>.github.io/<repo>/
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` (not `ci`): the lockfile was created on Windows, optional native packages differ per OS.
      - name: Install
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Optional: set these repository variables (Settings > Secrets and variables > Actions > Variables)
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.NEXT_PUBLIC_LEAD_ENDPOINT }}
        run: npm run build

      - name: Keep underscore folders (_next) for GitHub Pages
        run: touch apps/web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
